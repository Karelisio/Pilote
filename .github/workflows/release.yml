name: Release

# Pushing a tag vX.Y.Z builds the signed APK and publishes a GitHub Release with the changelog.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Repository that hosts the APKs (read by the in-app updater). Defaults to this repository.
      # If this repository becomes private, set the variable RELEASES_REPO (public repo) and the secret RELEASES_TOKEN.
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant"; exit 1; fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"

      - name: Tests and signed release build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature and rename
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -v "^WARNING"
          mkdir -p dist
          cp "$APK" "dist/pilote-${VERSION_NAME}.apk"
          rm -f "$KEYSTORE_PATH"

      - name: Changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$GITHUB_REF_NAME
          {
            echo "## Pilote ${VERSION_NAME}"
            echo
            git log --no-merges --pretty='- %s' "$RANGE" | grep -v -E '^- (Merge|Co-Authored)' || true
            echo
            echo "versionCode ${GITHUB_RUN_NUMBER}"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ github.ref_name }}
          name: Pilote ${{ env.VERSION_NAME }}
          body_path: CHANGELOG_RELEASE.md
          files: dist/pilote-${{ env.VERSION_NAME }}.apk
          make_latest: true
