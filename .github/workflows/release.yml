name: Release

# Every push to main reads the VERSION file. If tag vX.Y.Z does not exist yet, it builds the signed APK
# and publishes a GitHub Release (tag + changelog). Bump VERSION to ship a new release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Repository that hosts the APKs (read by the in-app updater). Defaults to this repository.
      # If this repository becomes private, set the variable RELEASES_REPO (public repo) and the secret RELEASES_TOKEN.
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::VERSION invalide : '$VERSION' (attendu X.Y.Z)"; exit 1; fi
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "Tag v$VERSION déjà publié : rien à faire (incrémentez VERSION pour une nouvelle release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip == 'false'

      - name: Android SDK
        if: steps.version.outputs.skip == 'false'
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Check signing secrets
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name manquant"; exit 1; fi
          done

      - name: Decode keystore
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "UPDATE_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"

      - name: Tests and signed release build
        if: steps.version.outputs.skip == 'false'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature and rename
        if: steps.version.outputs.skip == 'false'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -v "^WARNING"
          mkdir -p dist
          cp "$APK" "dist/pilote-${VERSION_NAME}.apk"
          rm -f "$KEYSTORE_PATH"

      - name: Changelog
        if: steps.version.outputs.skip == 'false'
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}HEAD
          {
            echo "## Pilote ${VERSION_NAME}"
            echo
            git log --no-merges --pretty='- %s' "$RANGE"
            echo
            echo "versionCode ${GITHUB_RUN_NUMBER}"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Pilote ${{ env.VERSION_NAME }}
          body_path: CHANGELOG_RELEASE.md
          files: dist/pilote-${{ env.VERSION_NAME }}.apk
          make_latest: true
