name: CI

on:
  push:
    branches-ignore: [main]  # main is built by the Release workflow
    tags-ignore: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
